<!DOCTYPE html>
<html>
<body>
<h1>Test JSON</h1>
<pre id="result"></pre>
<script>
    fetch('prices.json')
        .then(res => res.json())
        .then(data => document.getElementById('result').innerHTML = JSON.stringify(data, null, 2))
        .catch(err => document.getElementById('result').innerHTML = 'Error: ' + err);
</script>
</body>
</html>
